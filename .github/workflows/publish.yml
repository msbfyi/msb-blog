name: "Deploy to Cloudflare Pages"
on:
    schedule:
      - cron: 0 8/9 * * *
    push:
      branches:
        - main
        - feature/**
    workflow_run:
      workflows: [Generate and publish weekly link post]
      types:
        - completed
    workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    name: Publish to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # git describe --tags used to source this, but that raced against
      # release-please.yml — both trigger off the same push to main with
      # no ordering between them, and even when this job ran a few
      # seconds *after* release-please's tag-creation API call, the new
      # tag wasn't always visible yet to a fresh `git fetch` from this
      # job's own runner (confirmed for real: v2.2.0 shipped to
      # production still reading v2.1.1). .release-please-manifest.json
      # has no such race — it's a plain file committed as part of the
      # exact commit this job already checked out, no separate
      # tag-visibility propagation involved at all.
      - name: Get latest release version
        id: version
        run: echo "version=v$(jq -r '.["."]' .release-please-manifest.json 2>/dev/null || echo 0.0.0)" >> "$GITHUB_OUTPUT"
      # Run a build step here if your project requires


      - uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
        #   cache: 'npm'
      - run: npm install
      - run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - uses: stefanzweifel/git-auto-commit-action@v5 
        with:
          commit_message: "content: update wishlist"

      - name: Publish to Cloudflare Pages
       
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          directory: _site
          # Optional: Enable this if you want to have GitHub Deployments triggered
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Switch what branch you are publishing to.
          # By default this will be the branch which triggered this workflow
          #   branch: main
          # Optional: Change the working directory
          #   workingDirectory: msb-fyi
          # Optional: Change the Wrangler version, allows you to point to a specific version or a tag such as `beta`
          wranglerVersion: '3'
